<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sísifo · Revisión local</title><style>body{margin:0;background:#252820;color:#eadbb7;font-family:system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:30px 20px}h1{font:italic 40px Georgia;margin:12px 0}p{color:#c4b99c;line-height:1.5}video{width:100%;aspect-ratio:16/9;background:#111;display:block;margin:24px 0}button,label{border:1px solid #b5a67b;border-radius:5px;padding:12px 16px;display:inline-block;cursor:pointer;background:transparent;color:inherit;font:inherit}input{max-width:100%;margin:16px 0}button[aria-pressed=true]{background:#eadbb7;color:#252820}button:focus-visible,input:focus-visible{outline:3px solid #e6a36a;outline-offset:3px}.controls{display:flex;gap:10px;flex-wrap:wrap}</style><main><h1>Ver el movimiento.</h1><p>Elegí un render de tu computadora. El video permanece en tu dispositivo.</p><input id="file" type="file" accept="video/*" aria-label="Elegir video"><video id="video" controls playsinline preload="metadata"></video><div class="controls"><button id="slow" aria-pressed="false">0.5×</button><button id="normal" aria-pressed="true">1×</button><button id="loop" aria-pressed="false">Repetir</button></div><p id="status" role="status">Sin video cargado.</p></main><script>const video=document.getElementById('video'),file=document.getElementById('file'),status=document.getElementById('status');let url;file.onchange=()=>{if(!file.files[0])return;video.pause();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file.files[0]);video.src=url;status.textContent=file.files[0].name;};video.onerror=()=>status.textContent='No se pudo abrir el video. Probá el MP4 generado por encode.';for(const [id,rate] of [['slow',.5],['normal',1]])document.getElementById(id).onclick=()=>{video.playbackRate=rate;document.getElementById('slow').setAttribute('aria-pressed',rate===.5);document.getElementById('normal').setAttribute('aria-pressed',rate===1)};document.getElementById('loop').onclick=()=>{video.loop=!video.loop;document.getElementById('loop').setAttribute('aria-pressed',video.loop)};</script></html>
